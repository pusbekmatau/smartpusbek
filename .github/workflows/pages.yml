name: Deploy to GitHub Pages

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Hitung base path
        # Repo "user.github.io" dilayani dari root; repo lain dari /<nama-repo>.
        # Jika memakai domain sendiri, buat variabel repo CUSTOM_DOMAIN=true agar base path kosong.
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "${{ vars.CUSTOM_DOMAIN }}" = "true" ] || [[ "$REPO" == *.github.io ]]; then
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO" >> "$GITHUB_ENV"
          fi

      - run: npm ci

      - name: Build (static export)
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.APPS_SCRIPT_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "::warning::Variabel repo APPS_SCRIPT_URL belum diisi. Situs akan tampil, tetapi login dan data belum berfungsi."
          fi
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    # Hanya cabang utama (default) yang dipublikasikan; cabang lain cukup diuji build-nya.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
